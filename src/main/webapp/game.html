<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Java Escape - Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>


<body>

<div class="game-container">

    <h1>🚪 Java Escape</h1>

    <h2 id="company"></h2>

    <p id="question"></p>

    <div id="answers"></div>

    <button id="answerButton">
        Ответить
    </button>


    <div id="result" style="display:none;">

        <h2 id="resultTitle"></h2>

        <p id="resultText"></p>

        <button onclick="restartGame()">
            Играть снова
        </button>

    </div>

</div>


<script src="js/game.js"></script>

</body>

</html>
